name: test

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Verify pristine upstream source
        run: ./scripts/verify-upstream.py
      - name: Install upstream dependencies
        run: npm ci --include=dev
        working-directory: upstream
      - name: Test upstream
        run: npm test
        working-directory: upstream
      - name: Build upstream
        run: npm run build
        working-directory: upstream
